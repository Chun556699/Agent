<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AgentDesk</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #f5f3ee; color: #1c1a16;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-app-region: drag; user-select: none; cursor: default;
  }
  .bolt {
    width: 15px; height: 30px; background: #1c1a16;
    clip-path: polygon(72% 0, 0 58%, 38% 58%, 26% 100%, 100% 38%, 60% 38%);
    animation: pulse 1.6s cubic-bezier(.22,1,.36,1) infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.92); } }
  .name { font-family: Georgia, "Times New Roman", serif; font-size: 21px; letter-spacing: -.01em; }
  .sub { font-size: 11.5px; color: #a8a294; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="bolt"></div>
  <div class="name">AgentDesk</div>
  <div class="sub">Starting local server…</div>
</body>
</html>
